<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Galeri Fitkes Unjani</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://akdfitkes.unjani.ac.id/assets/images/logo.png">

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #120320;
            --bg-card: #1f0836;
            --purple-main: #3b1456;
            --purple-light: #7c3aed;
            --purple-hover: #6d28d9;
            --text-light: #f3e8ff;
            --text-muted: #d8b4fe;
            --border-glow: rgba(216, 180, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px 15px 100px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 25px;
            padding: 10px 0;
        }

        header img.logo {
            height: 65px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Filter Tabs & Search Bar */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border-glow);
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--purple-light);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-glow);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--purple-light);
            color: #fff;
            border-color: var(--purple-light);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 0;
        }

        .magazine-card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 3px solid #ffffff;
        }

        .magazine-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.4);
        }

        .magazine-image-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #1a092b;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magazine-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .magazine-card:hover .magazine-image-wrapper img {
            transform: scale(1.08);
        }

        .video-thumbnail-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .video-thumbnail-badge i {
            font-size: 3rem;
            color: var(--purple-light);
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }

        .magazine-card:hover .video-thumbnail-badge i {
            transform: scale(1.15);
            color: #a855f7;
        }

        .magazine-info {
            padding: 12px 14px;
            background: #ffffff;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .magazine-info-text span {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--purple-light);
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .magazine-info-text h3 {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .comment-badge {
            background-color: #f3e8ff;
            color: var(--purple-light);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .loading, .error-message, .empty-message {
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 50px 20px;
            font-size: 1rem;
            text-align: center;
        }

        .error-message {
            color: #fca5a5;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 2, 18, 0.94);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-container {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            max-width: 960px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            position: relative;
        }

        /* Media Container (Video / Image) */
        .modal-left {
            flex: 1.4;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            min-height: 320px;
            width: 100%;
        }

        .modal-left img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-left iframe {
            width: 100%;
            height: 100%;
            min-height: 320px;
            aspect-ratio: 16 / 9;
            border: none;
            border-radius: 8px;
        }

        .video-fallback-btn {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .video-fallback-btn:hover {
            background: var(--purple-light);
            color: #fff;
        }

        /* Right Panel (Details & Comments) */
        .modal-right {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            text-align: left;
            background: #170529;
            border-left: 1px solid var(--border-glow);
            overflow-y: auto;
        }

        .modal-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(216, 180, 254, 0.15);
            padding-right: 30px;
        }

        .modal-right h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            color: #fff;
            word-break: break-word;
        }

        .download-btn {
            background: rgba(124, 58, 237, 0.2);
            color: var(--text-muted);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: var(--purple-light);
            color: #fff;
        }

        .comments-list {
            flex: 1;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-author {
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
        }

        .comment-text {
            color: #f3e8ff;
            line-height: 1.4;
        }

        .comment-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            resize: none; 
            height: 65px;
            outline: none;
        }

        .comment-form textarea:focus {
            border-color: var(--purple-light);
            background: rgba(255, 255, 255, 0.12);
        }

        .comment-form button {
            background-color: var(--purple-light);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-size: 0.85rem;
        }

        .comment-form button:hover { 
            background-color: var(--purple-hover); 
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            color: #f3e8ff;
            font-size: 1.8rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: all 0.2s;
        }

        .close-btn:hover { 
            background: rgba(255, 255, 255, 0.2); 
            color: #fff; 
        }

        /* Navigasi Panah Modal */
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 15;
            transition: all 0.2s;
        }

        .modal-nav-btn:hover {
            background: var(--purple-light);
            border-color: var(--purple-light);
        }

        .modal-nav-btn.prev { left: 10px; }
        .modal-nav-btn.next { right: 10px; }

        .music-player-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3000;
            background: rgba(31, 8, 54, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .music-player-widget:hover {
            border-color: var(--purple-light);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
        }

        .music-disc {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c3aed, #3b1456);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .music-disc.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .music-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid var(--border-glow);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .music-btn:hover {
            background: var(--purple-light);
            transform: scale(1.05);
        }

        .volume-slider {
            width: 60px;
            accent-color: var(--purple-light);
            cursor: pointer;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(255, 255, 255, 0.95);
            color: #1a092b;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-info {
            background: #1f0836;
            color: var(--text-light);
            border: 1px solid var(--border-glow);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 820px) {
            body { padding: 15px 10px 90px 10px; }
            header h1 { font-size: 1.75rem; }

            .modal {
                padding: 10px;
            }

            .modal-container {
                flex-direction: column;
                max-height: 92vh;
                overflow-y: auto;
            }

            .modal-left {
                flex: none;
                width: 100%;
                min-height: 230px;
                padding: 10px;
            }

            .modal-left iframe {
                min-height: 220px;
                height: 240px;
                aspect-ratio: 16 / 9;
            }

            .modal-right {
                flex: none;
                width: 100%;
                padding: 16px;
                border-left: none;
                border-top: 1px solid var(--border-glow);
            }

            .modal-nav-btn {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }

            .music-player-widget {
                bottom: 12px;
                right: 12px;
                padding: 8px 12px;
            }

            .music-info {
                display: none; /* Sembunyikan judul lagu di HP agar tidak makan tempat */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="https://akdfitkes.unjani.ac.id/assets/images/logo.png" alt="Logo FITKES Unjani" class="logo" onerror="this.style.display='none'">
            <h1>Galeri FITKes Unjani</h1>
            <p>Dokumentasi Kegiatan & Gathering FITKES Unjani</p>
			<p>2026</p>
        </header>

        <div class="controls-wrapper">
            <!-- Search Bar -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari berdasarkan nama foto/video..." oninput="filterGallery()">
            </div>

            <!-- Tab Album Kategori -->
            <div class="category-tabs" id="categoryTabs">
                <button class="tab-btn active" onclick="switchCategory('video', this)"><i class="fa-solid fa-circle-play"></i> Video Gathering</button>
                <button class="tab-btn" onclick="switchCategory('coban', this)"><i class="fa-solid fa-mountain"></i> Coban Rondo</button>
                <button class="tab-btn" onclick="switchCategory('hotel', this)"><i class="fa-solid fa-hotel"></i> Hotel Batu/Malang</button>
                <button class="tab-btn" onclick="switchCategory('apel', this)"><i class="fa-solid fa-apple-whole"></i> Petik Apel</button>
                <button class="tab-btn" onclick="switchCategory('mikutopia', this)"><i class="fa-solid fa-camera"></i> Mikutopia</button>
                <button class="tab-btn" onclick="switchCategory('angkut', this)"><i class="fa-solid fa-car"></i> Museum Angkut</button>
                <button class="tab-btn" onclick="switchCategory('jatim-park', this)"><i class="fa-solid fa-icons"></i> Jatim Park</button>
            </div>
        </div>

        <!-- Gallery Grid Container -->
        <div class="magazine-grid" id="galleryContainer">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat galeri album...</div>
        </div>
    </div>

    <div class="modal" id="imageModal">
        <div class="modal-container">
            <button class="close-btn" id="closeModal" title="Tutup">&times;</button>
            
            <button class="modal-nav-btn prev" id="prevBtn" onclick="navigateModal(-1)" title="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="modal-nav-btn next" id="nextBtn" onclick="navigateModal(1)" title="Berikutnya"><i class="fa-solid fa-chevron-right"></i></button>

            <!-- Bagian Atas / Kiri: Media -->
            <div class="modal-left" id="modalMediaContainer">
                <!-- Media di-render secara dinamis di sini -->
            </div>

            <!-- Bagian Bawah / Kanan: Detail & Komentar -->
            <div class="modal-right">
                <div class="modal-header-info">
                    <h3 id="modalTitle">Judul Media</h3>
                    <a id="downloadBtn" class="download-btn" href="#" target="_blank" download><i class="fa-solid fa-download"></i> Unduh</a>
                </div>

                <div class="comments-list" id="commentsList">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Memuat komentar...</div>
                </div>

                <div class="comment-form">
                    <textarea id="commentInput" placeholder="Tulis komentar kamu..." required></textarea>
                    <button id="sendCommentBtn" onclick="submitComment()">Kirim Komentar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Tag (Direct Link MP3 Google Drive) -->
    <audio id="bgAudio" loop preload="auto">
        <source src="https://docs.google.com/uc?export=open&id=1uFwE0KOvV7OE1AntaXamK4O_kI96EyA9" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <!-- Floating Music Controls Widget -->
    <div class="music-player-widget" id="musicWidget">
        <div class="music-disc" id="musicDisc">
            <i class="fa-solid fa-music"></i>
        </div>
        <div class="music-info">
            <span class="music-title">Gathering FITKes</span>
            <span class="music-subtitle">Musik Latar</span>
        </div>
        <div class="music-controls">
            <button class="music-btn" id="togglePlayBtn" title="Putar/Jeda Musik" onclick="toggleAudio()">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            <input type="range" class="volume-slider" id="volumeControl" min="0" max="1" step="0.05" value="0.7" title="Pengatur Volume">
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const ALBUM_ENDPOINTS = {
            'video': 'https://script.google.com/macros/s/AKfycbxhCDIT3F7FqU2Fw51_Je80-CuwBuMKSE8e5IwDFdIU6zogtygbAgyzjgR4JQizX9PHBw/exec',
            'coban': 'https://script.google.com/macros/s/AKfycbxx5gb2eZMAtB8eSZggIKD-kLWNSR9gPJLTMJdAIr2t3QhmUD2Sc9FkpY8yipSWiB5IKw/exec',
            'hotel': 'https://script.google.com/macros/s/AKfycbwNEn7Q-h-VgNDjFZ5by-b3LsGh_J636CrfDiY5-3vtgBaG5vkrCTNtGt8qHz9FwF39xQ/exec',
            'apel': 'https://script.google.com/macros/s/AKfycbwoP2ZYIlrdsDQ69IwIKED4Fs-nvBR3dzWw6qyHoxhoIJC6hLQy3BNhqyN3E4gC2bffSQ/exec',
            'mikutopia': 'https://script.google.com/macros/s/AKfycbzk0jtBvIB9Z1sbv0ie5GjfsVM0F-abCIpa5xOzFXiYzVMtt0ntDhAHNG3oIN5yv_9mNA/exec',
            'angkut': 'https://script.google.com/macros/s/AKfycbxpOlU0d4hkK6xWJGwfvrcR_t5yA9DctF-qBauQWqIOdVW0PpA_EVFndnfgVH2h5tIZkg/exec',
            'jatim-park': 'https://script.google.com/macros/s/AKfycbz59MeIDn65DI-l2zTe8crsTXFLm8WobYkNu-2iLA-KPC35B8jEcNVq7YTgo7kvq8914A/exec'
        };

        let currentCategory = 'video';
        let albumData = [];
        let filteredData = [];
        let allComments = [];
        let currentIndex = -1;
        let userEmail = localStorage.getItem('gallery_user_email') || "Pengunjung FITKES";

        const modal = document.getElementById('imageModal');
        const modalTitle = document.getElementById('modalTitle');
        const commentsList = document.getElementById('commentsList');
        const closeModal = document.getElementById('closeModal');
        const downloadBtn = document.getElementById('downloadBtn');

        const bgAudio = document.getElementById('bgAudio');
        const playIcon = document.getElementById('playIcon');
        const musicDisc = document.getElementById('musicDisc');
        const volumeControl = document.getElementById('volumeControl');
        let audioHasAutoplayed = false;

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'info' ? 'toast-info' : ''}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${message}`;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3500);
        }

        function playAudio() {
            bgAudio.volume = volumeControl.value;
            bgAudio.play().then(() => {
                playIcon.className = 'fa-solid fa-pause';
                musicDisc.classList.add('playing');
                audioHasAutoplayed = true;
            }).catch(err => {
                console.log("Autoplay dicegah oleh kebijakan browser. Menunggu klik pengguna.");
            });
        }

        function pauseAudio() {
            bgAudio.pause();
            playIcon.className = 'fa-solid fa-play';
            musicDisc.classList.remove('playing');
        }

        function toggleAudio() {
            if (bgAudio.paused) {
                playAudio();
            } else {
                pauseAudio();
            }
        }

        volumeControl.addEventListener('input', (e) => {
            bgAudio.volume = e.target.value;
        });

        // Tangani kebijakan autoplay browser saat pengguna melakukan interaksi pertama di layar
        function handleFirstInteraction() {
            if (!audioHasAutoplayed && bgAudio.paused) {
                playAudio();
            }
            document.removeEventListener('click', handleFirstInteraction);
            document.removeEventListener('keydown', handleFirstInteraction);
            document.removeEventListener('touchstart', handleFirstInteraction);
        }

        document.addEventListener('click', handleFirstInteraction);
        document.addEventListener('keydown', handleFirstInteraction);
        document.addEventListener('touchstart', handleFirstInteraction);

        function closePopup() {
            modal.style.display = 'none';
            document.getElementById('modalMediaContainer').innerHTML = '';
            currentIndex = -1;
        }

        closeModal.addEventListener('click', closePopup);
        modal.addEventListener('click', (e) => { if (e.target === modal) closePopup(); });
        document.addEventListener('keydown', (e) => { 
            if (modal.style.display === 'flex') {
                if (e.key === 'Escape') closePopup();
                if (e.key === 'ArrowLeft') navigateModal(-1);
                if (e.key === 'ArrowRight') navigateModal(1);
            }
        });

        async function loadCategoryData(categoryKey) {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat media album...</div>';

            const endpointUrl = ALBUM_ENDPOINTS[categoryKey];

            try {
                // Fetch Photos/Videos
                const res = await fetch(endpointUrl);
                if (!res.ok) throw new Error('HTTP Status Error ' + res.status);
                
                let data = await res.json();
                
                // Fetch Comments (if available for this endpoint)
                try {
                    const resComments = await fetch(endpointUrl + "?action=getComments");
                    if (resComments.ok) {
                        allComments = await resComments.json();
                    } else {
                        allComments = [];
                    }
                } catch (e) {
                    allComments = [];
                }

                if (!data || !Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="empty-message"><i class="fa-regular fa-folder-open"></i> Tidak ada foto/video di dalam folder ini.</div>';
                    albumData = [];
                    filteredData = [];
                    return;
                }

                // Urutkan berdasarkan nama
                data.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                albumData = data;
                filterGallery();

            } catch (error) {
                console.error("Gagal memuat galeri:", error);
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fa-solid fa-triangle-exclamation"></i> Gagal terhubung ke Google Drive.<br>
                        <small style="color: var(--text-muted); font-size:0.8rem;">Pastikan koneksi internet stabil dan folder Google Drive disetting publik.</small>
                    </div>`;
            }
        }

        function switchCategory(categoryKey, btnElement) {
            currentCategory = categoryKey;
            
            // Update Tab UI Active State
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            // Reset search input
            document.getElementById('searchInput').value = '';

            loadCategoryData(categoryKey);
        }

        function filterGallery() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                filteredData = [...albumData];
            } else {
                filteredData = albumData.filter(item => item.name.toLowerCase().includes(query));
            }

            renderGallery();
        }

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="empty-message"><i class="fa-solid fa-magnifying-glass"></i> Media tidak ditemukan.</div>';
                return;
            }

            filteredData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'magazine-card';

                const isVideo = item.type === 'video' || (item.name && item.name.match(/\.(mp4|mov|mkv|avi|webm)$/i));
                const photoComments = allComments.filter(c => c.imageName === item.name);

                let mediaPreview = '';
                if (isVideo) {
                    mediaPreview = `
                        <div class="video-thumbnail-badge">
                            <i class="fa-solid fa-circle-play"></i>
                            <span>Putar Video</span>
                        </div>`;
                } else {
                    mediaPreview = `<img src="${item.url}" alt="${item.name}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/400x300/1a092b/ffffff?text=Gambar+Tidak+Tersedia';">`;
                }

                card.innerHTML = `
                    <div class="magazine-image-wrapper">
                        ${mediaPreview}
                    </div>
                    <div class="magazine-info">
                        <div class="magazine-info-text">
                            <span>Item 0${index + 1}</span>
                            <h3 title="${item.name}">${item.name}</h3>
                        </div>
                        <div class="comment-badge"><i class="fa-regular fa-comment"></i> ${photoComments.length}</div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(index));
                container.appendChild(card);
            });
        }

        function openModal(index) {
            if (index < 0 || index >= filteredData.length) return;

            currentIndex = index;
            const item = filteredData[currentIndex];
            const mediaContainer = document.getElementById('modalMediaContainer');
            mediaContainer.innerHTML = '';

            modalTitle.textContent = item.name;
            downloadBtn.href = item.url;

            const isVideo = item.type === 'video' || (item.name && item.name.match(/\.(mp4|mov|mkv|avi|webm)$/i));

            if (isVideo) {
                let videoUrl = item.url.replace(/\/view.*$/, '/preview');
                
                const iframe = document.createElement('iframe');
                iframe.src = videoUrl;
                iframe.allow = 'autoplay; fullscreen';
                
                // Backup Link jika iframe terblokir di beberapa peramban seluler
                const fallbackLink = document.createElement('a');
                fallbackLink.className = 'video-fallback-btn';
                fallbackLink.href = item.url;
                fallbackLink.target = '_blank';
                fallbackLink.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Video di Tab Baru (Google Drive)';

                mediaContainer.appendChild(iframe);
                mediaContainer.appendChild(fallbackLink);
            } else {
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;
                img.onerror = () => { img.src = 'https://placehold.co/600x400/1a092b/ffffff?text=Gagal+Memuat+Gambar'; };
                mediaContainer.appendChild(img);
            }

            renderCommentsForCurrentPhoto();
            modal.style.display = 'flex';
        }

        function navigateModal(direction) {
            if (currentIndex === -1 || filteredData.length === 0) return;
            let newIndex = currentIndex + direction;
            
            if (newIndex < 0) newIndex = filteredData.length - 1;
            if (newIndex >= filteredData.length) newIndex = 0;

            openModal(newIndex);
        }

        function renderCommentsForCurrentPhoto() {
            if (currentIndex === -1) return;
            const item = filteredData[currentIndex];
            const photoComments = allComments.filter(c => c.imageName === item.name);
            
            commentsList.innerHTML = '';

            if (!photoComments || photoComments.length === 0) {
                commentsList.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted);">Belum ada komentar. Jadilah yang pertama berkomentar!</div>';
                return;
            }

            photoComments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                
                const author = c.author ? escapeHtml(c.author) : 'Pengunjung';
                const commentText = escapeHtml(c.comment || '');

                div.innerHTML = `
                    <div class="comment-author">
                        <span><i class="fa-regular fa-user"></i> ${author}</span>
                    </div>
                    <div class="comment-text">${commentText}</div>
                `;
                commentsList.appendChild(div);
            });
            commentsList.scrollTop = commentsList.scrollHeight;
        }

        async function submitComment() {
            if (currentIndex === -1) return;
            
            const commentInput = document.getElementById('commentInput');
            const comment = commentInput.value.trim();
            const btn = document.getElementById('sendCommentBtn');
            const item = filteredData[currentIndex];

            if (!comment) {
                showToast('Komentar tidak boleh kosong!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Mengirim...';

            const endpointUrl = ALBUM_ENDPOINTS[currentCategory];

            try {
                // Post komentar ke Google Apps Script
                await fetch(endpointUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageName: item.name,
                        author: userEmail,
                        comment: comment
                    })
                });

                // Tambahkan komentar ke lokal
                allComments.push({
                    imageName: item.name,
                    author: userEmail,
                    comment: comment,
                    timestamp: new Date()
                });

                commentInput.value = '';
                renderCommentsForCurrentPhoto();
                renderGallery(); 
                showToast('Komentar berhasil dikirim!');
            } catch (error) {
                console.error("Gagal mengirim komentar:", error);
                showToast('Gagal mengirim komentar ke server.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kirim Komentar';
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCategoryData('video');
            // Coba putar musik secara otomatis saat DOM dimuat
            playAudio();
        });
    </script>
</body>
</html>
